# @package _global_
defaults:
  - /task/g1_super_mimic/base
  - _self_

training:
  task_name: G1SuperMimic
  sim_backend: mjwarp

env:
  mjwarp_nconmax: 128
  mjwarp_njmax: 500
  # Fixed-shape, host-sync-free autoreset (unilab 1.5.11 #2605). RNG note:
  # the reset lifecycle runs every step, so full-width samplers draw RNG on
  # steps without a done row and same-seed trajectories differ from the
  # selected-row lifecycle; deterministic evaluation keeps these flags off.
  masked_autoreset: true
  persistent_step_buffers: true
  # Disabled by default: graph replay poisons learning at training scale
  # (8k-iter BONES-SEED run crashed at 6061 with non-finite wm_loss; ep_len
  # stuck at ~21 from iter ~150 vs 108 with the graph off). Bisected to this
  # single flag over 300-iter ablations: compile off still fails, masked
  # trio off recovers, only this flag off recovers. Env-only probes show
  # reset sampling, RNG advance, done sets, and physics writeback all behave
  # identically under replay, so the defect hides in the collector/learner
  # interaction. The graph is worth only ~0.8% throughput here (3.373 vs
  # 3.345 it/s), so it stays off until the upstream defect is fixed.
  autoreset_cuda_graph: false
