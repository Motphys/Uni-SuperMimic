defaults:
  - _self_
  - task: g1_super_mimic/mjwarp

algo:
  algo: supermimic
  algo_log_name: supermimic
  load_run: "-1"
  checkpoint: -1
  resume: false
  seed: 0
  num_envs: 4096
  iterations: 8000
  buffer_steps: 1000
  utd: 0.4
  horizon: 32
  goal_frames: 10
  hist: 10
  z_dim: 32
  wm_hidden: [1024, 1024, 1024]
  wm_structured: true
  policy_hidden: [2048, 1024, 512, 256]
  critic_hidden: [256, 128]
  wm_window: 8
  wm_batches: 5
  wm_batch: 2048
  pi_batch: 2048
  lr: 4.0e-4
  pi_opt: muon
  wm_opt: muon
  no_sync: true
  pi_ema: 0.995
  gamma: 0.99
  lam: 0.95
  critic_epochs: 5
  critic_minibatches: 4
  no_critic: false
  # Critic minibatch loop of policy_update: eager (Python steps every minibatch, the
  # original path), graph (the whole loop captured into one CUDA graph and replayed
  # once per iteration; same eager ops on static buffers, permutations drawn outside the
  # graph, learning rate read from a device tensor; requires NVIDIA CUDA), or auto
  # (the default: graph on NVIDIA CUDA, eager anywhere else).
  critic_update: auto
  lr_decay_iters: 12000
  # BlinkMimic2-style actor-only imagined failure penalty (0 disables; 3.0 is
  # the BlinkMimic2 value). The critic keeps learning the plain reward.
  fail_penalty: 0.0
  # BlinkMimic2-style exams, off by default: exam_frac 0 keeps the pre-exam
  # behavior exactly. To enable, set exam_frac (e.g. 0.5): from exam_start_iter
  # on, the last exam_frac*num_envs worlds run full-clip exam episodes with the
  # EMA policy (requires pi_ema > 0), and the share of imagination starts drawn
  # from their transitions ramps linearly from exam_frac to exam_share_ramp
  # (0.9 matches BlinkMimic2's 10% practice fraction) over exam_ramp_iters.
  exam_start_iter: 4000
  exam_frac: 0.0
  exam_share_ramp: 0.9
  exam_ramp_iters: 2500
  # exams-v2 margin mode, off by default (requires exam_frac > 0): exam clips
  # are re-selected every exam_clip_window iterations by margin priority (the
  # per-clip EMA failure rate closest to 1 first, one exam row per clip), and
  # frontier_frac of the practice resets start inside a failed clip's frontier
  # window (failure frame - 50 .. clip end, equal mass per failed clip).
  # fail_ema is the failure-EMA decay (BlinkMimic2: 0.7).
  exam_margin: false
  exam_clip_window: 250
  frontier_frac: 0.5
  fail_ema: 0.7
  ckpt_every: 2000
  log_every: 50
  log_backend: tensorboard
  # Collect statistics (sim_rew / ep_len / ep_ret_norm / term_frac) on the device:
  # no per-step host sync in collect, read back once per log_every period. The CSV
  # keeps its definitions; those TensorBoard scalars become one point per period.
  # Tri-state like the switches below (null = on for NVIDIA CUDA, off elsewhere);
  # true forces it on, false keeps the synced path.
  stats_on_device: null
  amp: bf16
  compile: true
  test_hidden_dims: null
  # Host launch-overhead reductions. wm_graph / policy_graph replay the gradient step of
  # wm_update / of the policy in policy_update (imagination rollout + objective +
  # backward) from an explicit CUDA graph with persistent input buffers; the math is
  # unchanged. Tri-state: null (the default) enables them on NVIDIA CUDA and keeps them
  # off anywhere else, true requires NVIDIA CUDA, false forces the original path.
  wm_graph: null
  policy_graph: null
  # optimizer_graph replays the optimizer step after each of those graphs as well
  # (gradient clipping, Muon/Adam step, policy EMA) from a CUDA graph, bit-identical to
  # the eager step, with the learning rate read from device tensors. It needs the
  # gradient graph of the same update and no_sync; otherwise that step stays eager.
  # Tri-state the same way.
  optimizer_graph: null
  # collect_graph replays the learner's own work around each env step (observation, goal,
  # policy normalizers and policy forward before it; world-model normalizers and the
  # statistics after it) from CUDA graphs, bit-identical to the eager step. env.step is
  # untouched. Needs no_sync and the device-side statistics. Tri-state the same way.
  collect_graph: null
  # C++ inductor wrapper: launches the compiled Triton kernels without the Python
  # launcher. Opt-in, because it costs a slow C++ compile on every cold cache and gains
  # little once the graphs above are on.
  inductor_cpp_wrapper: false

training:
  task_name: G1SuperMimic
  sim_backend: mjwarp
  collector_tensor_device: auto
  sim2sim_strict: true
  log_root: null
  log_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
